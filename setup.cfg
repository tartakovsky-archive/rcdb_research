
[tool:pytest]
norecursedirs = .git logs notebooks
python_files = test_*.py
addopts = --cov-config=setup.cfg
log_cli = true
log_cli_level = DEBUG

[coverage:run]
branch = True
include = rcdb_research/*
omit = test/*
       tests/*
       logs/*
       venv/*
       */__pycache__/*
       .git/*

[coverage:report]
;fail_under = 30
exclude_lines =
    pragma: no cover


[flake8]
ignore = E226,E41,E702,E731,E402
max-line-length = 120
exclude = venv,.git,__pycache__
